<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="文渊阁图标">
  <!-- 墨蓝底圆 -->
  <circle cx="32" cy="32" r="31" fill="#17263A"/>
  <circle cx="32" cy="32" r="28" fill="none" stroke="#D4AF37" stroke-width="1" opacity="0.55"/>

  <!-- 重檐屋顶 -->
  <path d="M23 21 L32 15 L41 21 Z" fill="#D4AF37"/>
  <path d="M20 23 L44 23" stroke="#D4AF37" stroke-width="2" stroke-linecap="round"/>
  <path d="M19 28 L32 23 L45 28 Z" fill="#D4AF37"/>
  <path d="M16 30 L48 30" stroke="#D4AF37" stroke-width="2" stroke-linecap="round"/>

  <!-- 三开间柱 -->
  <path d="M22 31 V42 M28 31 V42 M36 31 V42 M42 31 V42"
        stroke="#D4AF37" stroke-width="2" stroke-linecap="round"/>

  <!-- 基座与台阶 -->
  <path d="M19 43 H45" stroke="#D4AF37" stroke-width="2" stroke-linecap="round"/>
  <path d="M17 46 H47" stroke="#D4AF37" stroke-width="2" stroke-linecap="round"/>
  <path d="M21 49 H43" stroke="#D4AF37" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>

  <!-- 渊水纹 -->
  <path d="M15 54 Q21 51 27 54 T39 54 T51 54"
        stroke="#D4AF37" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.85"/>
  <path d="M19 57 Q25 54 31 57 T43 57"
        stroke="#D4AF37" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.5"/>

  <!-- 朱印：点“文”与“批红” -->
  <rect x="29" y="33" width="6" height="7" rx="1" fill="#C0392B"/>
</svg>
