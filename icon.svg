<?xml version="1.0" encoding="UTF-8"?>
<!--
  班组 / Agent Team · 环上标记（Loop Mark）
  概念：一个右侧开口的圆角方框（工作容器）+ 一个落在开口处的圆（成员）。
  语义：方框开口 = 不是封闭的黑盒，人可以进来；圆压在边上 = 在环上（on the loop），不在环里。
  配色：方框跟随 currentColor，内联时即继承宿主 DSW alias 的 label-primary 系列；
  圆为品牌蓝 #5686fe（artwork 允许自有色，等同 static deepseek 450）。
  规格：32×32 画布，2.6 描边，四周留白不小于 2.5，最小可用 16px。
  用法：无文字、无渐变、无外部引用、无字体依赖；以 img 引用时方框取默认深色，双色版请内联使用。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32"
     fill="none" role="img" aria-labelledby="loopMarkTitle" color="#0f1115">
  <title id="loopMarkTitle">班组 Agent Team</title>
  <defs>
    <!-- 在方框右侧开一个圆口：白色保留、黑色挖空，避免依赖页面背景色 -->
    <mask id="loopMarkMouth" maskUnits="userSpaceOnUse" x="0" y="0" width="32" height="32">
      <rect x="0" y="0" width="32" height="32" fill="#fff"/>
      <circle cx="24.75" cy="16" r="7.6" fill="#000"/>
    </mask>
  </defs>
  <!-- 工作容器：右侧开口的圆角方框 -->
  <rect x="3.75" y="5.5" width="21" height="21" rx="6.5"
        stroke="currentColor" stroke-width="2.6" stroke-linejoin="round"
        mask="url(#loopMarkMouth)"/>
  <!-- 成员：落在开口处的圆 -->
  <circle cx="24.75" cy="16" r="4.8" fill="#5686fe"/>
</svg>
